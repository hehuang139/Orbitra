worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only Vite's content-hashed assets are safe to cache across deployments.
    map $uri $cache_control {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control $cache_control;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
            try_files $uri =404;
        }

        location /minecraft-official/piston-meta.mojang.com/ {
            limit_except GET { deny all; }
            proxy_ssl_server_name on;
            proxy_ssl_name piston-meta.mojang.com;
            proxy_set_header Host piston-meta.mojang.com;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass https://piston-meta.mojang.com/;
        }
        location /minecraft-official/launchermeta.mojang.com/ {
            limit_except GET { deny all; }
            proxy_ssl_server_name on;
            proxy_ssl_name launchermeta.mojang.com;
            proxy_set_header Host launchermeta.mojang.com;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass https://launchermeta.mojang.com/;
        }
        location /minecraft-official/piston-data.mojang.com/ {
            limit_except GET { deny all; }
            proxy_ssl_server_name on;
            proxy_ssl_name piston-data.mojang.com;
            proxy_set_header Host piston-data.mojang.com;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass https://piston-data.mojang.com/;
        }
        location /minecraft-official/launcher.mojang.com/ {
            limit_except GET { deny all; }
            proxy_ssl_server_name on;
            proxy_ssl_name launcher.mojang.com;
            proxy_set_header Host launcher.mojang.com;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass https://launcher.mojang.com/;
        }
        location /minecraft-official/libraries.minecraft.net/ {
            limit_except GET { deny all; }
            proxy_ssl_server_name on;
            proxy_ssl_name libraries.minecraft.net;
            proxy_set_header Host libraries.minecraft.net;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass https://libraries.minecraft.net/;
        }
        location /minecraft-official/resources.download.minecraft.net/ {
            limit_except GET { deny all; }
            proxy_ssl_server_name on;
            proxy_ssl_name resources.download.minecraft.net;
            proxy_set_header Host resources.download.minecraft.net;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass https://resources.download.minecraft.net/;
        }

        location ~ \.ttf$ {
            types { font/ttf ttf; }
            try_files $uri =404;
        }

        # Missing core files must fail rather than receiving the SPA document.
        location ~ ^/(assets|emulator|fonts|demo|licenses)(/|$) {
            try_files $uri =404;
        }

        location ~ \.[^/]+$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
