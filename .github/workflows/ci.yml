name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Verify container deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and verify the read-only container
        shell: bash
        run: |
          trap 'docker compose -p orbitra-deployment-ci logs --no-color; docker compose -p orbitra-deployment-ci down' EXIT
          docker compose -p orbitra-deployment-ci up -d --build --wait --wait-timeout 60
          test "$(docker compose -p orbitra-deployment-ci exec -T orbitra id -u)" -ne 0
          container_id="$(docker compose -p orbitra-deployment-ci ps -q orbitra)"
          docker inspect "$container_id" | jq -e '
            .[0].HostConfig.ReadonlyRootfs == true and
            (.[0].HostConfig.CapDrop | index("ALL")) != null and
            (.[0].HostConfig.SecurityOpt | index("no-new-privileges:true")) != null and
            .[0].HostConfig.Tmpfs["/tmp"] != null
          '
          DEPLOYMENT_TEST_URL=http://127.0.0.1:8080 node scripts/test-deployment.mjs

  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the original demo is reproducible
        run: |
          pnpm demo:build
          git diff --exit-code -- public/demo/star-orbit.gba public/demo/star-orbit.symbols.json

      - name: Verify dependency license notices
        run: |
          pnpm licenses:generate
          git diff --exit-code -- public/licenses/DEPENDENCIES.txt

      - name: Verify bundled core asset
        run: pnpm verify:core

      - name: Run unit tests
        run: |
          pnpm test
          pnpm test:account-server
          pnpm test:online-library-server

      - name: Build production bundle
        run: pnpm build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: orbitra-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser integration tests
        shell: bash
        env:
          ENGINE_TEST_URL: http://127.0.0.1:5173
          UI_TEST_URL: http://127.0.0.1:5173
          ENGINE_SCREENSHOT_PATH: .artifacts/engine.png
        run: |
          mkdir -p .artifacts
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort > .artifacts/vite.log 2>&1 &
          vite_pid=$!
          ONLINE_LIBRARY_HOST=127.0.0.1 \
          ONLINE_LIBRARY_PORT=4174 \
          ONLINE_LIBRARY_ALLOWED_ORIGINS=http://127.0.0.1:5173 \
          ONLINE_LIBRARY_ADMIN_TOKEN=distribution-test-token \
            pnpm start:library > .artifacts/online-library.log 2>&1 &
          library_pid=$!
          trap 'kill "$vite_pid" "$library_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$UI_TEST_URL" > /dev/null; then
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null || [ "$attempt" -eq 30 ]; then
              cat .artifacts/vite.log
              exit 1
            fi
            sleep 1
          done
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/healthz > /dev/null; then
              break
            fi
            if ! kill -0 "$library_pid" 2>/dev/null || [ "$attempt" -eq 30 ]; then
              cat .artifacts/online-library.log
              exit 1
            fi
            sleep 1
          done
          # Each suite uses only the original Star Orbit ROM or generated variants.
          # All suites run even when an earlier suite fails, preserving their logs.
          result=0
          for suite in engine platforms ui zip saves keyboard gamepad touch startup recovery backup account online-library; do
            # A blocked native call can also block Playwright cleanup. Bound
            # each suite so its failure still leaves time for the other logs.
            timeout --kill-after=10s 180s pnpm "test:$suite" 2>&1 | tee ".artifacts/test-$suite.log" || result=1
          done
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > .artifacts/vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$vite_pid" "$preview_pid" "$library_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null || [ "$attempt" -eq 30 ]; then
              cat .artifacts/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PWA_TEST_URL=http://127.0.0.1:4173 timeout --kill-after=10s 180s pnpm test:pwa 2>&1 | tee .artifacts/test-pwa.log || result=1
          exit "$result"

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
